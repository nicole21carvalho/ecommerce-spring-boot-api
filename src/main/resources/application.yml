spring:
  application:
    name: loja-cci
  datasource:
    # Banco em memória: a API roda sem instalar nada além do Java
    url: jdbc:h2:mem:loja;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # Carrega o data.sql depois que o Hibernate cria as tabelas
    defer-datasource-initialization: true
  data:
    web:
      pageable:
        max-page-size: 100
        # Formato de página estável: { content, page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
